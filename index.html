<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumple, Foquita ❤️</title>

    <style>
        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg,#ffdde1,#ee9ca7);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .tarjeta{
            background:white;
            max-width:600px;
            width:90%;
            padding:40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
        }

        h1{
            color:#d6336c;
            margin-bottom:20px;
        }

        p{
            font-size:20px;
            color:#444;
            line-height:1.6;
        }

        img{
            width:260px;
            margin-top:25px;
            border-radius:12px;
        }

        .aviso{
            margin-top:20px;
            font-size:16px;
            color:#777;
        }
    </style>
</head>

<body>

<div class="tarjeta">

<h1>🎉 ¡Feliz cumpleaños, Manu! 🎉</h1>

<p>
Espero que hayas pasado un día hermoso.<br><br>

Quería hacerte un regalito sencillo, pero como yo no soy sencillo te hice esto ahora mismito porque te quiero mucho ❤️.<br><br>

Escaneá el QR de abajo y disfruta de una hermosaa rudyta 
</p>

<img src="qr.png.png" alt="QR del regalo">

<p class="aviso">
¡Feliz cumple! 😊
</p>

</div>

</body>
</html>
